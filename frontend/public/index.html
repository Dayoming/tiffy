<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Tiffy</title>
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta content="" name="keywords">
  <meta content="" name="description">

  <!-- Favicon -->
  <link rel="apple-touch-icon" sizes="57x57" href="<%= BASE_URL %>favicon/apple-icon-57x57.png">
  <link rel="apple-touch-icon" sizes="60x60" href="<%= BASE_URL %>favicon/apple-icon-60x60.png">
  <link rel="apple-touch-icon" sizes="72x72" href="<%= BASE_URL %>favicon/apple-icon-72x72.png">
  <link rel="apple-touch-icon" sizes="76x76" href="<%= BASE_URL %>favicon/apple-icon-76x76.png">
  <link rel="apple-touch-icon" sizes="114x114" href="<%= BASE_URL %>favicon/apple-icon-114x114.png">
  <link rel="apple-touch-icon" sizes="120x120" href="<%= BASE_URL %>favicon/apple-icon-120x120.png">
  <link rel="apple-touch-icon" sizes="144x144" href="<%= BASE_URL %>favicon/apple-icon-144x144.png">
  <link rel="apple-touch-icon" sizes="152x152" href="<%= BASE_URL %>favicon/apple-icon-152x152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="<%= BASE_URL %>favicon/apple-icon-180x180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="<%= BASE_URL %>favicon/android-icon-192x192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="<%= BASE_URL %>favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="96x96" href="<%= BASE_URL %>favicon/favicon-96x96.png">
  <link rel="icon" type="image/png" sizes="16x16" href="<%= BASE_URL %>favicon/favicon-16x16.png">

  <!-- 기타 Favicon 링크들 -->
  <link rel="manifest" href="<%= BASE_URL %>favicon/manifest.json">
  <meta name="msapplication-TileColor" content="#ffffff">
  <meta name="msapplication-TileImage" content="<%= BASE_URL %>favicon/ms-icon-144x144.png">
  <meta name="theme-color" content="#ffffff">

  <!-- Google Web Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500&family=Lora:wght@600;700&display=swap" rel="stylesheet">

  <!-- Vendor Stylesheet -->

  <!-- Customized Bootstrap Stylesheet -->
  <link href="<%= BASE_URL %>css/bootstrap.min.css" rel="stylesheet"/>

  <!-- Icon Font Stylesheet -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Libraries Stylesheet -->
  <link href="<%= BASE_URL %>lib/animate/animate.min.css" rel="stylesheet">
  <link href="<%= BASE_URL %>lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">

  <!-- Vendor JS -->


  <!-- Template Stylesheet -->
  <link href="<%= BASE_URL %>css/style.css" rel="stylesheet"/>
</head>
<body>
<noscript>
  <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
</noscript>
<div id="app"></div>

<!-- JavaScript Libraries -->
<script src="https://code.jquery.com/jquery-3.4.1.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" defer></script>
<script src="<%= BASE_URL %>lib/wow/wow.min.js" defer></script>
<script src="<%= BASE_URL %>lib/easing/easing.min.js" defer></script>
<script src="<%= BASE_URL %>lib/waypoints/waypoints.min.js" defer></script>
<script src="<%= BASE_URL %>lib/owlcarousel/owl.carousel.min.js" defer></script>
<script src="<%= BASE_URL %>js/main.js" defer></script>
<script src="<%= BASE_URL %>js/functions.js" defer></script>

<!-- Vendors -->


<!-- Main Chat START -->
<div class="d-none d-lg-block">
  <!-- Chat sidebar START -->
  <div class="offcanvas offcanvas-end" data-bs-scroll="true" data-bs-backdrop="false" tabindex="-1" id="offcanvasChat">
    <!-- Offcanvas header -->
    <div class="offcanvas-header d-flex justify-content-between">
      <h5 class="offcanvas-title">Message</h5>
      <div class="d-flex">
        <!-- Close  -->
        <a href="#" class="btn btn-secondary-soft-hover py-1 px-2" data-bs-dismiss="offcanvas" aria-label="Close">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-x-lg" viewBox="0 0 16 16">
            <path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z"/>
          </svg>
        </a>

      </div>
    </div>
    <!-- Offcanvas body START -->
    <div class="offcanvas-body pt-0 custom-scrollbar">
      <!-- Search contact START -->
      <form class="rounded position-relative">
        <input class="form-control ps-5 bg-light" type="search" placeholder="Search..." aria-label="Search">
        <button class="btn bg-transparent px-3 py-0 position-absolute top-50 start-0 translate-middle-y" type="submit"><i class="bi bi-search fs-5"> </i></button>
      </form>
      <!-- Search contact END -->
      <ul class="list-unstyled">

        <!-- Contact item -->
        <li class="mt-3 hstack gap-3 align-items-center position-relative toast-btn" data-target="chatToast">
          <!-- Avatar -->
          <div class="avatar status-online">
            <img class="avatar-img rounded-circle" src="<%= BASE_URL %>icon/profile-default-icon.png" alt="">
          </div>
          <!-- Info -->
          <div class="overflow-hidden">
            <a class="h6 mb-0 stretched-link" href="#!">Nickname</a>
            <div class="small text-secondary text-truncate">채팅 테스트 내용입니다.</div>
          </div>
          <!-- Chat time -->
          <div class="small ms-auto text-nowrap"> Just now </div>
        </li>
        <!-- Contact item -->
        <li class="mt-3 hstack gap-3 align-items-center position-relative toast-btn" data-target="chatToast2">
          <!-- Avatar -->
          <div class="avatar status-online">
            <img class="avatar-img rounded-circle" src="<%= BASE_URL %>icon/profile-default-icon.png" alt="">
          </div>
          <!-- Info -->
          <div class="overflow-hidden">
            <a class="h6 mb-0 stretched-link" href="#!">다영</a>
            <div class="small text-secondary text-truncate">사과 사세요.</div>
          </div>
          <!-- Chat time -->
          <div class="small ms-auto text-nowrap"> Just now </div>
        </li>
      </ul>
    </div>
    <!-- Offcanvas body END -->
  </div>
  <!-- Chat sidebar END -->
</div>
</body>
</html>
